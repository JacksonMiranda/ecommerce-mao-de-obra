name: 💡 Solicitação de Funcionalidade / Feature Request
description: Sugerir uma nova funcionalidade para o projeto
title: '[FEATURE] '
labels: ['enhancement', 'needs-triage']
assignees: ['JacksonMiranda']

body:
  - type: markdown
    attributes:
      value: |
        Obrigado por sugerir uma nova funcionalidade! Suas ideias ajudam a melhorar o projeto.
        
        Thank you for suggesting a new feature! Your ideas help improve the project.

  - type: textarea
    id: problem
    attributes:
      label: 🎯 Problema Relacionado / Related Problem
      description: Esta funcionalidade resolve um problema? Descreva-o. / Is this feature related to a problem? Describe it.
      placeholder: Eu fico frustrado quando... / I'm frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 💡 Solução Proposta / Proposed Solution
      description: Descreva a solução que você gostaria de ver / Describe the solution you'd like to see
      placeholder: Eu gostaria que... / I would like...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Alternativas Consideradas / Alternatives Considered
      description: Descreva alternativas que você considere / Describe alternatives you've considered
      placeholder: Eu também pensei em... / I also thought about...

  - type: dropdown
    id: priority
    attributes:
      label: 📊 Prioridade / Priority
      description: Qual a importância desta funcionalidade? / How important is this feature?
      options:
        - Baixa / Low - seria bom ter / would be nice to have
        - Média / Medium - melhoraria significativamente a experiência / would significantly improve experience
        - Alta / High - essencial para o uso / essential for usage
        - Crítica / Critical - bloqueador / blocking issue
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Categoria / Category
      description: Que tipo de funcionalidade é esta? / What type of feature is this?
      options:
        - Interface do Usuário / User Interface
        - Funcionalidade de Pagamento / Payment Functionality
        - Performance / Performance
        - Segurança / Security
        - Acessibilidade / Accessibility
        - Documentação / Documentation
        - Configuração / Configuration
        - Outro / Other
    validations:
      required: true

  - type: textarea
    id: user-stories
    attributes:
      label: 👤 Histórias de Usuário / User Stories
      description: Como diferentes usuários se beneficiariam? / How would different users benefit?
      placeholder: |
        Como [tipo de usuário], eu quero [funcionalidade] para que [benefício]
        
        As a [user type], I want [feature] so that [benefit]

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: ✅ Critérios de Aceitação / Acceptance Criteria
      description: Como saberemos que esta funcionalidade está completa? / How will we know this feature is complete?
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
        - [ ] Critério 3

  - type: textarea
    id: mockups
    attributes:
      label: 🎨 Mockups/Wireframes
      description: Se você tem ideias visuais, compartilhe aqui / If you have visual ideas, share them here
      placeholder: Cole imagens ou links para mockups / Paste images or links to mockups

  - type: dropdown
    id: implementation
    attributes:
      label: 🛠️ Disponibilidade para Implementar / Availability to Implement
      description: Você pode ajudar a implementar esta funcionalidade? / Can you help implement this feature?
      options:
        - Sim, posso implementar / Yes, I can implement
        - Sim, mas preciso de orientação / Yes, but I need guidance
        - Talvez, dependendo da complexidade / Maybe, depending on complexity
        - Não, mas posso testar / No, but I can test
        - Não, apenas sugerindo / No, just suggesting
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 📋 Informações Adicionais / Additional Information
      description: Qualquer contexto adicional sobre a funcionalidade / Any additional context about the feature
      placeholder: Links, referências, exemplos de outros projetos / Links, references, examples from other projects

  - type: checkboxes
    id: terms
    attributes:
      label: ✅ Checklist
      description: Confirme que você verificou o seguinte / Confirm that you have checked the following
      options:
        - label: Eu procurei por funcionalidades similares / I searched for similar features
          required: true
        - label: Esta funcionalidade beneficiaria outros usuários / This feature would benefit other users
          required: true
        - label: Eu li a documentação do projeto / I read the project documentation
          required: true