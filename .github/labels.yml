# Standard repository labels configuration
# This file defines standardized labels for issue and PR management

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "feature"
  color: "0075ca"
  description: "New feature or request"

- name: "ui/ux"
  color: "c5def5"
  description: "Interface e experiência do usuário"

- name: "a11y"
  color: "0e8a16"
  description: "Acessibilidade"

- name: "chore"
  color: "fef2c0"
  description: "Maintenance tasks, refactoring, or other non-feature work"

- name: "docs"
  color: "0075ca"
  description: "Documentation improvements or additions"

- name: "perf"
  color: "fbca04"
  description: "Performance improvements"

- name: "refactor"
  color: "e99695"
  description: "Code refactoring without changing functionality"

- name: "test"
  color: "0e8a16"
  description: "Adding or updating tests"

- name: "ci"
  color: "0052cc"
  description: "Continuous integration and deployment"

- name: "security"
  color: "b60205"
  description: "Security-related issues or improvements"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"